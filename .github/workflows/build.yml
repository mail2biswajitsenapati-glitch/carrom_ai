name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    - name: Fix Manifest Typo and Create Gradle Files
      run: |
        # Teri spelling mistake (AndroidMainfest -> AndroidManifest) theek karne ke liye:
        if [ -f "app/src/main/AndroidMainfest.xml" ]; then
          mv app/src/main/AndroidMainfest.xml app/src/main/AndroidManifest.xml
        fi

        echo "android.useAndroidX=true" > gradle.properties
        echo "org.gradle.jvmargs=-Xmx2048m" >> gradle.properties

        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = 'CarromAI'
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
        }
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }
        android {
            namespace 'com.ldrago.carromai'
            compileSdk 34

            defaultConfig {
                applicationId "com.ldrago.carromai"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
        }
        EOF

    - name: Build APK
      run: gradle assembleDebug

    - name: Upload APK File
      uses: actions/upload-artifact@v4
      with:
        name: L-Drago-Bot-APK
        path: app/build/outputs/apk/debug/app-debug.apk
